name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_BUILD_PACKAGES: >-
    libwebkit2gtk-4.1-dev
    libasound2-dev
    libjack-jackd2-dev
    libpipewire-0.3-dev
    libdbus-1-dev
    clang
    libclang-dev
    libusb-1.0-0-dev
    build-essential
    curl
    wget
    file
    libxdo-dev
    libssl-dev
    libudev-dev
    pkg-config
    libayatana-appindicator3-dev
    librsvg2-dev

jobs:
  golden_audio_hosts:
    name: Golden Audio hosts (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            runs_on: windows-latest
            features: asio,jack,realtime
          - label: macOS
            runs_on: macos-15
            features: jack
          - label: Linux
            runs_on: ubuntu-24.04
            features: jack,native-pipewire,realtime-dbus
            install_linux_deps: true
    steps:
      - uses: actions/checkout@v6
      - name: Activate repository-pinned Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/install-rust-toolchain.ps1
      - name: Activate repository-pinned Rust toolchain (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/install-rust-toolchain.sh
      - name: Install Linux audio prerequisites
        if: ${{ matrix.install_linux_deps }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_BUILD_PACKAGES
      - name: Cache CPAL ASIO SDK outside the checkout
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/chataigne-tool-cache/asio-sdk
          key: asio-sdk-${{ hashFiles('tools/bootstrap/toolchain.json') }}
      - name: Configure pinned audiosdk/asio SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "chataigne-tool-cache/asio-sdk"
          $sdk = ./tools/bootstrap/configure-asio-sdk.ps1 -CacheRoot $cache -PassThru
          "CPAL_ASIO_DIR=$sdk" >> $env:GITHUB_ENV
      - name: Configure LLVM for ASIO bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = (Get-Command clang -ErrorAction Stop).Source
          "LIBCLANG_PATH=$(Split-Path -Parent $clang)" >> $env:GITHUB_ENV
      - name: Read canonical Python version
        if: runner.os == 'Windows'
        id: audio-pins
        shell: pwsh
        run: |
          $pins = Get-Content tools/bootstrap/toolchain.json -Raw | ConvertFrom-Json
          "python=$($pins.python.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: ${{ steps.audio-pins.outputs.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: golden-audio-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/bootstrap/toolchain.json') }}
      - name: Verify backend-neutral audio core
        run: cargo test --locked -p golden_audio --no-default-features
      - name: Compile and test platform audio hosts
        run: cargo test --locked -p golden_audio --features "${{ matrix.features }}"
      - name: Probe hosts without opening streams
        run: cargo run --locked -p golden_audio --example backend_probe --features "${{ matrix.features }}"
      - name: Verify standalone Golden Audio distribution
        if: runner.os == 'Windows'
        run: >-
          python tools/qualification/external_audio_consumer.py
          --target-dir target/external-audio-consumer
          --report target/qualification/external-audio-consumer.json
      - name: Upload standalone-consumer evidence
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-audio-external-consumer-${{ github.sha }}
          path: target/qualification/external-audio-consumer.json
          if-no-files-found: warn

  golden_rust:
    name: Golden Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: golden_video/d3d11,golden_video/ndi,golden_video/browser-preview
          - os: macos-15
            features: golden_video/wgpu-backend,golden_video/browser-preview
          - os: ubuntu-24.04
            features: golden_video/wgpu-backend,golden_video/browser-preview
    steps:
      - uses: actions/checkout@v6
      - name: Activate pinned Rust on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/bootstrap/install-rust-toolchain.ps1
      - name: Activate pinned Rust on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./tools/bootstrap/install-rust-toolchain.sh
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_BUILD_PACKAGES
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --locked --workspace --features "${{ matrix.features }}" -- --test-threads=1
      - run: git diff --exit-code

  golden_ui:
    name: Golden UI and contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sh ./tools/bootstrap/install-rust-toolchain.sh
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers for audio codegen
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run codegen
      - name: Verify generated output
        run: |
          git diff --exit-code -- packages
          test -z "$(git ls-files --others --exclude-standard -- packages)"
      - run: npx --workspace golden_ui playwright-core install --with-deps chromium
      - run: npm run test:browser:dashboard --workspace golden_ui -- --dense-only
      - run: npm run test:browser --workspace golden_video_ui
      - run: git diff --exit-code
